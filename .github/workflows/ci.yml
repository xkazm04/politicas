# CI — kvalitativní brána (vzor: personas/.github/workflows/ci.yml, zeštíhleno).
# Lokální ekvivalent celé brány je `npm run check` (viz lefthook.yml).

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node 24 = npm 11, stejná major verze jako generuje package-lock.json
      # lokálně. Na Node 22 (npm 10) se strom volitelných peer závislostí
      # (@swc/helpers, @emnapi/runtime, @emnapi/core) rozpadá jinak a `npm ci`
      # hlásí drift. Ze stejného důvodu jsou @emnapi/runtime i @emnapi/core
      # deklarované explicitně v devDependencies: lockfile psaný na Windows
      # jinak vynechá optional peer, který linuxový runner potřebuje.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (incl. custom rules)
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Custom lint-rule tests (RuleTester)
        run: npm run test:rules

      # These two ran ONLY on the author's machine until 2026-08-24, which made
      # them a courtesy rather than a gate: every local rung can be bypassed
      # with a flag or simply never installed on a fresh clone, so the merge
      # rung is the only one that refuses. CI must therefore be a SUPERSET of
      # `npm run check` — and `lib/testing/gateLadder.test.ts` now derives that
      # containment from package.json instead of trusting this comment.
      - name: Census self-test (the gate's own liveness)
        run: npm run census:test

      - name: Library adherence report
        run: npm run library:check

      # lib/db/migrations/0001_civic_graph.sql je snapshot CORE_DDL
      # (lib/db/pglite/ddl.ts) — nesmí se rozejít.
      - name: Schema snapshot drift
        run: npm run db:snapshot -- --check

      - name: Build
        run: npm run build

      # Informativní: `npm audit` hlásí 0 zranitelností (stav 2026-08-22, po
      # bumpu next 16.2.11 -> 16.3.1). Ten bump odstranil postcss i sharp
      # advisories, které tu byly dříve vedeny jako akceptované; zbylé čtyři
      # (brace-expansion, fast-uri, js-yaml, nanoid) spadly prostým
      # `npm audit fix`. Krok zůstává NEBLOKUJÍCÍ — je to signál pro
      # Dependabota (.github/dependabot.yml), ne brána.
      - name: Dependency audit (non-blocking)
        run: npm audit --audit-level=high
        continue-on-error: true
