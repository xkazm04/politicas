# CI — kvalitativní brána (vzor: personas/.github/workflows/ci.yml, zeštíhleno).
# Lokální ekvivalent celé brány je `npm run check` (viz lefthook.yml).

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node 24 = npm 11, stejná major verze jako generuje package-lock.json
      # lokálně. Na Node 22 (npm 10) se strom volitelných peer závislostí
      # (@swc/helpers, @emnapi/runtime) rozpadá jinak a `npm ci` hlásí drift.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (incl. custom rules)
        run: npm run lint

      - name: Test
        run: npm run test

      # lib/db/migrations/0001_civic_graph.sql je snapshot CORE_DDL
      # (lib/db/pglite/ddl.ts) — nesmí se rozejít.
      - name: Schema snapshot drift
        run: npm run db:snapshot -- --check

      - name: Build
        run: npm run build

      # Informativní: `npm audit --omit=dev` hlásí 5 high (stav 2026-08-05):
      # next→postcss (4 advisories: 3× sourceMappingURL arbitrary file read +
      # 1× XSS ve stringify výstupu) — akceptováno: postcss běží v buildu nad
      # naším vlastním CSS, ne nad uživatelským vstupem; next→sharp (libvips
      # CVE) — akceptováno: build-time obrazová pipeline nad našimi assety;
      # samotný next je počítán, protože na zranitelných postcss/sharp závisí —
      # oprava je až next@16.3.0, který před launchem záměrně nebumpujeme;
      # brace-expansion (glob) + fast-uri jsou řešitelné prostým
      # `npm audit fix` a spadnou při nejbližším bumpu. Krok proto NEBLOKUJE —
      # je to signál pro Dependabota (.github/dependabot.yml), ne brána.
      - name: Dependency audit (non-blocking)
        run: npm audit --audit-level=high
        continue-on-error: true
