# Live-Graph Sentinel — invariant audit of the real ingested store
# (batch-7 item 7E).
#
# HONEST LIMITATION: the live `.pglite` store is a local, gitignored 1.6 GB
# data dir — it does not exist on a hosted GitHub runner. This workflow only
# earns a schedule once the store is reachable from CI (a self-hosted runner on
# the ingest machine, or a store artifact download step at the ADOPTION POINT
# below).
#
# WHY THIS JOB NOW GOES RED WITHOUT A STORE (2026-08-13). Until today the run
# step was gated on a guard step (`if: steps.guard.outputs.present == 'true'`),
# and a SKIPPED step does not fail a job — so on `ubuntu-latest`, where the
# store can never exist, this workflow rendered as a green check mark with zero
# invariants evaluated. The header claimed the guard was "a loud no-op instead
# of a false green"; it was a QUIET no-op that looked exactly like a pass. That
# is the precise confusion the sentinel exists to abolish, turned on itself.
#
# The fix chosen, and why: the run step is now UNCONDITIONAL. Running it is
# strictly more informative than guarding it — `npm run sentinel` detects the
# absent store itself, writes a schema-valid report whose sixteen checks are all
# `unevaluable` (verdict "unevaluable", never "ok"), and exits 2. So the job
# fails, the failure NAMES the adoption point, and the artifact says which
# invariants were not evaluated. The alternative (keep the guard, fail the job
# in the absent branch) produces the same red with one more moving part and no
# machine report. The artifact upload is `if: always()` on BOTH branches: a run
# that evaluated nothing still owes the reader its report.
#
# THE CRON IS BACK, AND THE ADOPTION POINT IS WIRED (2026-09-04, moonshot #26).
# The store reaches the runner as an ARTIFACT: `npm run db:backup` on the ingest
# machine takes a CHECKPOINTed, pruned copy through lib/db/pglite/storeCopy.ts,
# and the `store-snapshot` artifact it uploads is downloaded here. Two properties
# of that path matter and are not incidental:
#
#   • it is a COPY. The sentinel never opens a live handle (PGlite is
#     single-connection), and a backup copy is a cold one by construction —
#     the same door `SENTINEL_NO_COPY` was built for.
#   • it carries pg_wal. Between checkpoints the recent commits live ONLY
#     there; a copy without it is a store that opens and quietly lacks the last
#     writes. db:backup is the only copy path in the repo, for that reason.
#
# THE JOB STAYS RED ON `unevaluable`. If the artifact is missing or expired, the
# sentinel reports every invariant as not-evaluated and exits 2, and this job
# fails. That is the entire discipline: a nightly that goes green because
# nothing ran is the failure this instrument exists to prevent, and a cron
# makes that failure mode DAILY rather than occasional.
name: sentinel

on:
  workflow_dispatch: {}
  schedule:
    # Nightly 03:17 UTC — off the hour to dodge the cron herd.
    - cron: "17 3 * * *"

jobs:
  sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Pinned to 24 for the same reason as ci.yml: the lockfile is written
          # by npm 11 (node 24) and npm 10 (node 22) places optional peer deps
          # differently, so a node-22 runner fails `npm ci` with a permanent
          # phantom "lock file out of sync". This job sat on 22 and would have
          # died at `npm ci` before ever reaching the sentinel.
          node-version: 24
          cache: npm
      - run: npm ci
      # ADOPTION POINT (wired 2026-09-04): materialize the store from the
      # newest `store-snapshot` artifact the ingest machine uploaded. Never
      # gating — a download that finds nothing leaves ./.pglite absent, the
      # sentinel says every invariant was not evaluated, and the job goes red.
      # `continue-on-error` is on the DOWNLOAD, not on the audit: a missing
      # artifact must reach the reader as an unevaluable report, not as a step
      # that failed before writing one.
      - name: Fetch the store snapshot (db:backup artifact from the ingest machine)
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: store-snapshot
          path: ./.pglite
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # The artifact is produced by a different workflow run on the ingest
          # machine, so it is looked up across runs rather than in this one.
          run-id: ${{ vars.SENTINEL_STORE_RUN_ID }}
          repository: ${{ github.repository }}
      - name: Store present?
        # Annotation only — this step NEVER gates the run. It exists so the log
        # names the adoption point next to the failure that follows.
        run: |
          if [ -d ./.pglite ]; then
            echo "::notice::.pglite store present — the sentinel will evaluate the real invariants"
          else
            echo "::warning::.pglite store not present on this runner — the sentinel will report every invariant as UNEVALUATED and this job will fail (exit 2). The store arrives as the \`store-snapshot\` artifact of a \`npm run db:backup\` run on the ingest machine; set the repository variable SENTINEL_STORE_RUN_ID to that run, or run \`npm run sentinel\` locally."
          fi
      - name: Run sentinel (read-only; exit 1 = violation, exit 2 = nothing evaluated)
        run: SENTINEL_JSON=sentinel-report.json npm run sentinel
      - name: Upload machine report
        # BOTH branches, always: the whole point of the unevaluable report is
        # that "never ran" leaves an artifact instead of silence.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sentinel-report
          path: sentinel-report.json
          if-no-files-found: warn
